<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kristiana Priscantelli — Actress, Performer, Storyteller" />
    <title>Kristiana Priscantelli</title>

    <!-- LCP image: preload so the hero photo starts fetching before CSS/JS finish -->
    <link rel="preload" as="image" href="/images/hero.jpg" fetchpriority="high" />

    <!-- Google Fonts: Bebas Neue (display) + Cormorant Garamond (serif) + Inter (body) -->
    <!-- Trimmed to weights actually used in the codebase — Caveat was an unused fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Inter:wght@300&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
